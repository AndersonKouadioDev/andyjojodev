<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 34" fill="none">
  <!--
    "AK" ligature
    The Nkyinkyim zigzag flows through both letters:
    - Forms the left stroke of A, the crossbar, and the strokes of K
    - One continuous cultural DNA running through the initials
  -->

  <!-- Left leg of A -->
  <path
    d="M3 30 L15 4"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Right leg of A flowing into K's stem -->
  <path
    d="M27 30 L15 4"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Nkyinkyim zigzag as the crossbar of A + strokes of K -->
  <path
    d="M8 20 L14 12 L20 20 L26 12 L32 20 L38 4"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- K lower stroke — extends from the zigzag -->
  <path
    d="M32 20 L42 30"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- K vertical stem -->
  <path
    d="M32 4 L32 30"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Accent dots at zigzag peaks -->
  <circle cx="14" cy="12" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="26" cy="12" r="1.5" fill="currentColor" opacity="0.4"/>
</svg>
