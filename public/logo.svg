<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!--
    "Nkyinkyim"
    Adinkra symbol — Akan/Baoulé culture, Côte d'Ivoire
    Wavy organic contour with more pronounced undulations
  -->

  <!-- Wavy contour — pronounced waves, asymmetric -->
  <path
    d="M24 2 Q32 -1 37 6 Q42 13 38 18 Q43 24 39 30 Q36 38 28 39 Q22 44 16 40 Q9 38 5 32 Q0 26 3 20 Q0 13 5 8 Q10 1 17 3 Q20 4 24 2Z"
    stroke="currentColor"
    stroke-width="3.2"
    fill="none"
    opacity="0.3"
  />

  <!-- Main Nkyinkyim path — slightly larger, centered -->
  <path
    d="M11 32 L11 24 L18 17 L18 24 L25 17 L25 24 L32 17"
    stroke="currentColor"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Accent dots at peaks -->
  <circle cx="18" cy="17" r="1.5" fill="currentColor" opacity="0.45"/>
  <circle cx="25" cy="17" r="1.5" fill="currentColor" opacity="0.45"/>
</svg>
